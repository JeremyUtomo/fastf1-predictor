services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - /var/lib/fastf1:/data  # FastF1 cache, backtest store, prediction log

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-f1.jeremyutomo.com}
      WORLDS_DOMAIN: ${WORLDS_DOMAIN:-worlds.jeremyutomo.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Worlds 2026 predictor (github.com/JeremyUtomo/worlds-2026-predictor), served by
  # the Caddy above. Built from a local clone that deploy/auto-deploy.sh keeps at
  # the newest Worlds commit whose CI passed.
  worlds-app:
    build: &worlds-build ${WORLDS_DIR:-/opt/worlds-2026-predictor}
    image: worlds-2026-predictor
    restart: unless-stopped
    environment:
      WORLDS_MODE: server
    volumes:
      - worlds_data:/data
    mem_limit: 900m

  # re-runs the Worlds model after every finished match
  worlds-updater:
    build: *worlds-build
    image: worlds-2026-predictor
    restart: unless-stopped
    command: ["python", "live.py", "--loop", "--interval", "120"]
    healthcheck:
      disable: true
    environment:
      WORLDS_MODE: server
    volumes:
      - worlds_data:/data
    mem_limit: 900m

volumes:
  caddy_data:
  caddy_config:
  worlds_data:
